plugins { id 'com.android.application' }

android {
    namespace 'com.fastcar.home'
    compileSdk 33

    defaultConfig {
        applicationId 'com.fastcar.home'
        minSdk 24
        targetSdk 33
        versionCode 2
        versionName '2.0'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            // debug калит билан имзоланади — тўғридан-тўғри ўрнатса бўлади
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
