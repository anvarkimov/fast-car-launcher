plugins { id 'com.android.application' }

android {
    namespace 'com.fastcar.home'
    compileSdk 33

    defaultConfig {
        applicationId 'com.fastcar.home'
        minSdk 24
        targetSdk 33
        // GitHub Actions ҳар йиғишда рақамни оширади (run_number)
        versionCode (project.findProperty('appVersionCode') ?: '3').toInteger()
        versionName (project.findProperty('appVersionName') ?: '3.0')
    }
    signingConfigs {
        release {
            // Доимий калит: янгиланишлар ўрнатилган лаунчер устига тушиши учун шарт
            storeFile file('release.jks')
            storePassword 'fastlauncher'
            keyAlias 'fastlauncher'
            keyPassword 'fastlauncher'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
